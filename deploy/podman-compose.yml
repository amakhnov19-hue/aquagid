version: '3.8'

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: aquagid_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      DB_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/aquagid_prod
      JWT_SECRET: ${JWT_SECRET}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY}
      TBANK_PASSWORD: ${TBANK_PASSWORD}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY}
      BASE_URL: https://24aquabooking.ru
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: always
    volumes:
      - uploads:/var/www/shared-uploads

  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend:/var/www/frontend
      - uploads:/var/www/shared-uploads
      - certs:/etc/letsencrypt
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  uploads:
  certs:
