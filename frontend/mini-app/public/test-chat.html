<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Тест SupportChat</title>
    <script src="/js/components/ui/DesignSystem.js?v=20260223_01"></script>
    <script src="/js/components/ui/SupportChat.js?v=20260223_01"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .button {
            background: #0066CC;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
        
        .button:hover {
            background: #0052a3;
        }
        
        .info {
            background: #f5f5f5;
            border-left: 4px solid #0066CC;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .chat-container {
            margin-top: 30px;
            border: 2px dashed #0066CC;
            padding: 20px;
            border-radius: 8px;
            position: relative;
            min-height: 100px;
        }
        
        .chat-container::before {
            content: "Чат появится здесь (кнопка справа внизу)";
            color: #999;
            position: absolute;
            top: 10px;
            left: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест компонента SupportChat</h1>
        
        <div class="info">
            <strong>📌 Инструкция:</strong>
            <ul>
                <li>Чат появится в правом нижнем углу</li>
                <li>Нажми на синюю кнопку с иконкой 💬</li>
                <li>Отправь тестовое сообщение</li>
                <li>Поддержка ответит через 1 секунду</li>
            </ul>
        </div>
        
        <div>
            <button class="button" onclick="testToggle()">🔄 Открыть/закрыть чат</button>
            <button class="button" onclick="testMessage()">📝 Отправить тестовое сообщение</button>
            <button class="button" onclick="testClear()">🗑️ Очистить историю</button>
            <button class="button" onclick="testUnread()">🔔 Добавить непрочитанное</button>
        </div>
        
        <div class="chat-container" id="support-chat-container">
            <!-- Сюда будет вставлен чат -->
        </div>
    </div>
    
    <script>
        // Загружаем стили DesignSystem
        AquaGid.DesignSystem.injectStyles();
        
        // Инициализируем чат
        window.addEventListener('load', function() {
            AquaGid.SupportChat.render('support-chat-container');
            console.log('SupportChat инициализирован');
        });
        
        // Тестовые функции
        function testToggle() {
            AquaGid.SupportChat.toggle();
        }
        
        function testMessage() {
            AquaGid.SupportChat.addMessage('Тестовое сообщение от пользователя', 'user');
            setTimeout(() => {
                AquaGid.SupportChat.addMessage('Это тестовый ответ поддержки!', 'support');
            }, 500);
        }
        
        function testClear() {
            AquaGid.SupportChat.clearHistory();
        }
        
        function testUnread() {
            AquaGid.SupportChat.unreadCount++;
            AquaGid.SupportChat.updateBadge();
        }
    </script>
</body>
</html>
