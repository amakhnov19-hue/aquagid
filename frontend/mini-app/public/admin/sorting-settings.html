<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки сортировки | AquaGid</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .section { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 10px; }
        .weight-item { display: flex; align-items: center; margin: 10px 0; }
        .weight-item label { width: 150px; }
        .weight-item input { width: 80px; padding: 5px; }
        .save-btn { background: #0066CC; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>⚙️ Настройки сортировки катеров</h1>
    
    <div class="section">
        <h2>Веса приоритетов</h2>
        <p>Чем выше число, тем больше влияние на позицию в списке</p>
        
        <div class="weight-item">
            <label>Подписка:</label>
            <input type="number" id="weight-subscription" value="100" min="0" max="1000">
        </div>
        <div class="weight-item">
            <label>Рейтинг (за звезду):</label>
            <input type="number" id="weight-rating" value="10" min="0" max="100">
        </div>
        <div class="weight-item">
            <label>Популярность (за бронь):</label>
            <input type="number" id="weight-popularity" value="5" min="0" max="50">
        </div>
        <div class="weight-item">
            <label>Новый катер:</label>
            <input type="number" id="weight-new" value="3" min="0" max="50">
        </div>
        <div class="weight-item">
            <label>Случайность:</label>
            <input type="number" id="weight-random" value="1" min="0" max="10">
        </div>
    </div>
    
    <div class="section">
        <h2>Дополнительные настройки</h2>
        
        <div class="weight-item">
            <label>Дней считать новым:</label>
            <input type="number" id="new-boat-days" value="30" min="1" max="365">
        </div>
        
        <div class="weight-item">
            <label>Включить случайность:</label>
            <input type="checkbox" id="enable-random" checked>
        </div>
    </div>
    
    <button class="save-btn" onclick="saveSettings()">💾 Сохранить настройки</button>
    
    <script>
        async function saveSettings() {
            const settings = {
                weights: {
                    subscription: parseInt(document.getElementById('weight-subscription').value),
                    rating: parseInt(document.getElementById('weight-rating').value),
                    popularity: parseInt(document.getElementById('weight-popularity').value),
                    newBoat: parseInt(document.getElementById('weight-new').value),
                    random: parseInt(document.getElementById('weight-random').value)
                },
                newBoatDays: parseInt(document.getElementById('new-boat-days').value),
                enableRandom: document.getElementById('enable-random').checked
            };
            
            // TODO: отправить на бэкенд
            console.log('Сохранено:', settings);
            alert('Настройки сохранены (тест)');
        }
    </script>
</body>
</html>
