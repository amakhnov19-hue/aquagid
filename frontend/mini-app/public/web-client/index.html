    <!-- Яндекс.Навигация -->

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('✅ Service Worker зарегистрирован'))
            .catch(err => console.log('❌ Service Worker ошибка:', err));
    }
    </script>

    <script src="/shared/js/components/PushNotifications.js"></script>
</head>
<body>
    <div id="app" class="loading">Загрузка...</div>

    <!-- Контейнеры для чата и документации -->
    <div id="support-chat-container"></div>
    <div id="documentation-container"></div>
    <div id="my-bookings-container" style="display: none;"></div>

    <!-- ========== ЯДРО (ОБЯЗАТЕЛЬНО ПЕРВЫМИ!) ========== -->

    <script src="js/config/yandex_config.js"></script>
    <!-- ========== КОНСТАНТЫ ========== -->
    <script src="js/config/app_constants.js"></script>
    <script src="js/utils/api_client.js"></script>

    <!-- ========== УТИЛИТЫ ========== -->
    <script src="js/utils/fingerprint.js"></script>
    <script src="js/utils/securityLogger.js"></script>
    
    <!-- ========== СЕРВИСЫ ========== -->
    <script src="js/services/manager_service.js"></script>
    <script src="js/services/boat_service.js"></script>
    <script src="js/services/booking_service.js"></script>
    <script src="js/services/settings_service.js"></script>
    <script src="js/services/MessengerService.js"></script>
    <script src="js/components/business/AvailabilityService.js"></script>
    <script src="js/components/business/BoatRanking.js"></script>
    <script src="/shared/js/components/NotificationCenter.js"></script>
    
    <!-- ========== БАЗОВЫЙ КЛАСС ========== -->
    <script src="js/components/ui/core/ScreenBase.js"></script>
    
    <!-- ========== ЭКРАНЫ ========== -->
    <script src="js/components/ui/screens/WelcomeScreen.js"></script>
    <script src="js/components/ui/screens/DateScreen.js"></script>
    <script src="js/components/ui/screens/TimeScreen.js"></script>
    <script src="js/components/ui/screens/DurationScreen.js"></script>
    <script src="js/components/ui/screens/BoatScreen.js"></script>
    <script src="js/components/ui/screens/ConfirmationScreen.js?v=20260501"></script>
    <script src="js/components/ui/screens/SuccessScreen.js"></script>
    <script src="js/components/ui/TestChecklist.js?v=20260501b"></script>
    <script src="js/components/ui/screens/QuickScreen.js"></script>
    <script src="js/components/ui/screens/MyBookingsScreen.js"></script>
    
    <!-- ========== UI КОМПОНЕНТЫ ========== -->
    <script src="js/components/ui/DesignSystem.js"></script>
    <script src="js/components/ui/Documentation.js"></script>
    <script src="/shared/js/components/ChatService.js"></script>
    <script src="js/components/ui/SupportChat.js"></script>
    <script src="js/components/ui/MyBookings.js"></script>
    <script src="js/components/ui/CancelBooking.js"></script>
    <script src="js/components/ui/WeatherWidget.js"></script>

    <!-- ========== ПЛАТЕЖНЫЙ МОДУЛЬ ========== -->
    <script src="js/components/payment/PaymentGateway.js"></script>
    <script src="js/components/payment/Gateways/DummyGateway.js"></script>
    <script src="js/services/PaymentService.js"></script>
    <script src="js/components/payment/PaymentUI.js"></script>
    <script src="js/components/payment/PaymentConfig.js"></script>

    <script>
        // Инициализация платежного сервиса
        const paymentService = new PaymentService();
        window.paymentService = paymentService;

        // Инициализация PaymentUI
        const paymentUI = new PaymentUI();
        paymentUI.init(paymentService);
        window.paymentUI = paymentUI;
        console.log('✅ Платежный модуль инициализирован');
    </script>

    <!-- ========== ЗАГРУЗЧИК ИЗОБРАЖЕНИЙ ========== -->
    <script src="js/components/ui/ImageLoader.js"></script>
    
    <!-- ========== ГЛАВНЫЙ КЛАСС ========== -->
    <script src="js/components/ui/core/UnifiedScreens.js"></script>

    <script>
        // Показываем приветственный экран
        setTimeout(() => {
            if (window.AquaGid?.UnifiedScreens) {
                window.AquaGid.UnifiedScreens.showWelcomeScreen();
                console.log('✅ UnifiedScreens инициализирован');
            } else {
                console.error('❌ UnifiedScreens не загружен');
            }
        }, 100);
    </script>

    <script>
    // Проверка функции
    setTimeout(() => {
        console.log('🔍 Проверка showWelcomeScreen:', window.AquaGid?.UnifiedScreens?.showWelcomeScreen);
    }, 500);
    </script>

    <!-- ========== ДОКУМЕНТАЦИЯ ========== -->
    <script>
        // Инициализация документации после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            if (window.AquaGid?.Documentation) {
                window.AquaGid.Documentation.render();
            }
        });
    </script>

    <!-- ========== ЧАТ ПОДДЕРЖКИ ========== -->
    <script>
        // Инициализация чата поддержки
        document.addEventListener('DOMContentLoaded', function() {
            if (window.AquaGid?.SupportChat) {
                window.AquaGid.SupportChat.render();
                console.log('✅ Чат поддержки инициализирован');
            } else {
                console.warn('⚠️ SupportChat не загружен');
            }
        });
    </script>
</body>
</html>
