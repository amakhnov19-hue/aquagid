<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация менеджера | АкваГид</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .password-wrapper {
            display: flex;
            gap: 8px;
        }
        .password-wrapper input {
            flex: 1;
        }
        .toggle-password {
            width: 50px;
            padding: 0;
            background: #f0f0f0;
            color: #333;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .success {
            color: #10b981;
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div id="registerFormContainer">
            <h1>📋 Регистрация менеджера</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label>Имя и фамилия *</label>
                    <input type="text" id="fullName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Придумайте пароль">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Подтвердите пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordConfirm" required placeholder="Повторите пароль">
                        <button type="button" class="toggle-password" onclick="togglePassword('passwordConfirm')">👁️</button>
                    </div>
                </div>
                
                <hr>
                
                <div class="form-group">
                    <label>Название компании *</label>
                    <input type="text" id="companyName" required placeholder="ООО АкваГид">
                </div>
                <div class="form-group">
                    <label>Телефон (для связи с клиентами) *</label>
                    <input type="tel" id="managerPhone" required placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="managerEmail" required placeholder="manager@example.com">
                </div>
                
                <div class="error" id="formError"></div>
                <button type="submit" id="submitBtn">Зарегистрироваться →</button>
            </form>
        </div>

        <div id="success" class="success">
            <h2>✅ Регистрация завершена!</h2>
            <p>Перенаправление в личный кабинет...</p>
        </div>
        <div class="loading" id="loading">⏳ Загрузка...</div>
    </div>

    <script>
        const token = window.location.pathname.split('/').pop();
        let inviteData = null;

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function checkInvite() {
            try {
                const response = await fetch(`/api/admin/auth/check-invite/${token}`);
                if (!response.ok) {
                    showError('Ссылка недействительна или истекла');
                    document.getElementById('submitBtn').disabled = true;
                    return false;
                }
                inviteData = await response.json();
                return true;
            } catch (error) {
                showError('Ошибка проверки приглашения');
                return false;
            }
        }

        function showConsentModal(callback) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10000;';
            modal.innerHTML = `
                <div style="background:#fff;border-radius:16px;padding:24px;width:360px;text-align:left;">
                    <h3 style="margin-top:0;">📜 Условия использования</h3>
                    <div style="background:#f8f9fa;border-radius:8px;padding:12px;margin-bottom:16px;">
                        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
                            <input type="checkbox" id="modal-consent-terms" style="margin-top:3px;width:18px;height:18px;flex-shrink:0;">
                            <span style="font-size:13px;line-height:1.5;">
                                Я принимаю условия Договора оказания услуг (Публичной оферты) и даю Согласие на обработку персональных данных в соответствии с Политикой конфиденциальности.
                            </span>
                        </label>
                    </div>
                    <button id="modal-continue" disabled style="width:100%;padding:12px;background:#0066CC;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;opacity:0.5;">
                        Продолжить
                    </button>
                    <button id="modal-cancel" style="width:100%;padding:10px;background:#e5e7eb;border:none;border-radius:8px;margin-top:8px;cursor:pointer;">
                        Отмена
                    </button>
                </div>`;
            document.body.appendChild(modal);
            
            const chk = document.getElementById('modal-consent-terms');
            const btn = document.getElementById('modal-continue');
            chk.onchange = () => {
                btn.disabled = !chk.checked;
                btn.style.opacity = chk.checked ? '1' : '0.5';
            };
            document.getElementById('modal-continue').onclick = () => {
                modal.remove();
                callback();
            };
            document.getElementById('modal-cancel').onclick = () => modal.remove();
        }

        async function doRegister(fullName, password, companyName, managerPhone, managerEmail) {
            showLoading(true);
            try {
                const registerResponse = await fetch('/api/admin/register-manager', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token, full_name: fullName, password,
                        phone: inviteData?.phone || '',
                        consent_terms: true, consent_pd: true
                    })
                });
                if (!registerResponse.ok) { const e = await registerResponse.json(); throw new Error(e.detail || 'Ошибка'); }
                const reg = await registerResponse.json();
                
                await fetch(`/api/managers/${reg.manager_id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company_name: companyName, phone: managerPhone, email: managerEmail, full_name: fullName })
                });
                
                const login = await fetch('/api/managers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: managerPhone, password })
                });
                const loginResult = await login.json();
                localStorage.clear();
                localStorage.setItem('managerToken', loginResult.token);
                localStorage.setItem('access_token', loginResult.token);
                localStorage.setItem('managerId', loginResult.id);
                localStorage.setItem('managerName', fullName);
                
                document.getElementById('registerFormContainer').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                setTimeout(() => { window.location.href = '/'; }, 2000);
            } catch(e) {
                showError(e.message);
            }
            showLoading(false);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const companyName = document.getElementById('companyName').value.trim();
            const managerPhone = document.getElementById('managerPhone').value.trim();
            const managerEmail = document.getElementById('managerEmail').value.trim();

            if (!fullName || !password || !companyName || !managerPhone || !managerEmail) {
                showError('Заполните все поля');
                return;
            }
            if (password !== passwordConfirm) {
                showError('Пароли не совпадают');
                return;
            }

            showConsentModal(() => {
                doRegister(fullName, password, companyName, managerPhone, managerEmail);
            });
        });

        function showError(message) {
            const el = document.getElementById('formError');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        checkInvite();
    </script>
</body>
</html>
