<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация менеджера | АкваГид</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .password-wrapper {
            display: flex;
            gap: 8px;
        }
        .password-wrapper input {
            flex: 1;
        }
        .toggle-password {
            width: 50px;
            padding: 0;
            background: #f0f0f0;
            color: #333;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .success {
            color: #10b981;
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div id="registerFormContainer">
            <h1>📋 Регистрация менеджера</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label>Имя и фамилия *</label>
                    <input type="text" id="fullName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Придумайте пароль">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Подтвердите пароль *</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordConfirm" required placeholder="Повторите пароль">
                        <button type="button" class="toggle-password" onclick="togglePassword('passwordConfirm')">👁️</button>
                    </div>
                </div>
                
                <hr>
                
                <div class="form-group">
                    <label>Название компании *</label>
                    <input type="text" id="companyName" required placeholder="ООО АкваГид">
                </div>
                <div class="form-group">
                    <label>Телефон (для связи с клиентами) *</label>
                    <input type="tel" id="managerPhone" required placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="managerEmail" required placeholder="manager@example.com">
                </div>
                
                <div class="error" id="formError"></div>
                <button type="submit" id="submitBtn">Зарегистрироваться →</button>
            </form>
        </div>

        <div id="success" class="success">
            <h2>✅ Регистрация завершена!</h2>
            <p>Перенаправление в личный кабинет...</p>
        </div>
        <div class="loading" id="loading">⏳ Загрузка...</div>
    </div>

    <script>
        const token = window.location.pathname.split('/').pop();
        let inviteData = null;

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function checkInvite() {
            try {
                const response = await fetch(`/api/admin/auth/check-invite/${token}`);
                if (!response.ok) {
                    showError('Ссылка недействительна или истекла');
                    document.getElementById('submitBtn').disabled = true;
                    return false;
                }
                inviteData = await response.json();
                return true;
            } catch (error) {
                showError('Ошибка проверки приглашения');
                return false;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const companyName = document.getElementById('companyName').value.trim();
            const managerPhone = document.getElementById('managerPhone').value.trim();
            const managerEmail = document.getElementById('managerEmail').value.trim();

            if (!fullName || !password || !companyName || !managerPhone || !managerEmail) {
                showError('Заполните все поля');
                return;
            }
            if (password !== passwordConfirm) {
                showError('Пароли не совпадают');
                return;
            }

            showLoading(true);

            try {
                // 1. Регистрируем менеджера
                const registerResponse = await fetch('/api/admin/register-manager', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        full_name: fullName,
                        password: password,
                        phone: inviteData?.phone || ''
                    })
                });

                if (!registerResponse.ok) {
                    const error = await registerResponse.json();
                    throw new Error(error.detail || 'Ошибка регистрации');
                }

                const registerResult = await registerResponse.json();
                const managerId = registerResult.manager_id;

                // 2. Обновляем профиль
                const profileResponse = await fetch(`/api/managers/${managerId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        company_name: companyName,
                        phone: managerPhone,
                        email: managerEmail,
                        full_name: fullName
                    })
                });

                if (!profileResponse.ok) {
                    throw new Error('Ошибка сохранения профиля');
                }

                // 3. Авторизуем нового менеджера (через email)
                const loginResponse = await fetch('/api/managers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login: managerEmail,
                        password: password
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error('Ошибка авторизации');
                }

                const loginResult = await loginResponse.json();
                localStorage.setItem('token', loginResult.token);
                localStorage.setItem('managerId', loginResult.id);

                // Успех!
                document.getElementById('registerFormContainer').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                showLoading(false);

                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                showError(error.message);
                showLoading(false);
            }
        });

        function showError(message) {
            const el = document.getElementById('formError');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('submitBtn').disabled = show;
        }

        checkInvite();
    </script>
</body>
</html>
