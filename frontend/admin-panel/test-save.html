<!DOCTYPE html>
<html>
<head>
    <title>Тест сохранения</title>
</head>
<body>
    <h1>🧪 Тест сохранения настроек</h1>
    
    <button onclick="testPing()">1. Тест ping</button>
    <button onclick="testEcho()">2. Тест echo</button>
    <button onclick="testSettings()">3. Тест settings</button>
    
    <div id="result" style="margin-top: 20px; white-space: pre;"></div>

    <script src="js/config/api_config.js"></script>
    <script>
        async function testPing() {
            const res = await fetch('http://46.229.215.40:8082/api/test/ping');
            const data = await res.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        }
        
        async function testEcho() {
            const testData = { test: "hello", number: 123 };
            const res = await fetch('http://46.229.215.40:8082/api/test/echo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(testData)
            });
            const data = await res.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        }
        
        async function testSettings() {
            const testData = {
                prepayment: { default: 25 },
                season: { start: "2026-06-01" }
            };
            const res = await fetch('http://46.229.215.40:8082/api/settings', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_CONFIG.getToken()}`
                },
                body: JSON.stringify(testData)
            });
            const data = await res.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
