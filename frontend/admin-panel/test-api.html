<!DOCTYPE html>
<html>
<head>
    <title>Тест API</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px; margin: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🧪 Тест подключения к API</h1>
    
    <div>
        <button onclick="testManagers()">📋 Получить менеджеров</button>
        <button onclick="testLogin()">🔑 Тест логина</button>
        <button onclick="testMe()">👤 Проверить токен</button>
        <button onclick="clearToken()">🗑️ Очистить токен</button>
    </div>
    
    <div id="result" style="margin-top: 20px;"></div>
    
        <script src="js/config/api_config.js"></script>
    <script src="js/utils/api_client.js"></script>
    <script src="js/services/manager_service.js"></script>
    <script>
        console.log('🔍 Проверка загрузки:');
        console.log('- API_CONFIG:', window.API_CONFIG ? '✅' : '❌');
        console.log('- apiClient:', window.apiClient ? '✅' : '❌');
        console.log('- ManagerService:', window.ManagerService ? '✅' : '❌');
        
        function showResult(data, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <h3 class="${isError ? 'error' : 'success'}">Результат:</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }
        
        async function testManagers() {
            try {
                if (!window.ManagerService) {
                    throw new Error('ManagerService не загружен');
                }
                const managers = await ManagerService.getAll();
                showResult(managers);
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }
        
        async function testLogin() {
            const phone = prompt("Введите телефон (например +79991112233):");
            const password = prompt("Введите пароль:");
            
            try {
                const response = await fetch(`${API_CONFIG.baseURL}${API_CONFIG.endpoints.auth.login}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `grant_type=password&username=${encodeURIComponent(phone)}&password=${encodeURIComponent(password)}`
                });
                
                const data = await response.json();
                if (response.ok) {
                    API_CONFIG.setToken(data.access_token);
                    showResult({ message: "Успешный вход!", token: data.access_token });
                } else {
                    showResult({ error: data.detail }, true);
                }
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }
        
        async function testMe() {
            try {
                const response = await fetch(`${API_CONFIG.baseURL}${API_CONFIG.endpoints.auth.me}`, {
                    headers: API_CONFIG.getHeaders()
                });
                const data = await response.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message }, true);
            }
        }
        
        function clearToken() {
            API_CONFIG.removeToken();
            showResult({ message: "Токен очищен" });
        }
    </script>
</body>
</html>
